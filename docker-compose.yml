services:
  postgres:
    # 使用官方 pgvector 镜像
    image: pgvector/pgvector:pg17
    container_name: interview-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: interview_guide
    volumes:
      # 使用绑定挂载，数据持久化到本地目录
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0
    container_name: interview-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      # 使用绑定挂载，数据持久化到本地目录
      - ./data/redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: interview-rustfs-dev
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # 使用绑定挂载，数据持久化到本地目录
      - ./data/rustfs:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

  createbucket:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c " aws --endpoint-url http://rustfs:9000 s3 mb s3://interview-guide || true; exit 0; "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: interview-qdrant-dev
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC（Spring AI 使用此端口）
    volumes:
      # 使用绑定挂载，数据持久化到本地目录
      - ./data/qdrant:/qdrant/storage

  # Nginx 反代：去掉 Qdrant Dashboard 的 X-Frame-Options，允许前端 iframe 嵌入
  qdrant-proxy:
    image: nginx:alpine
    container_name: interview-qdrant-proxy-dev
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "6335:6335"   # 前端 iframe 访问此端口（已去掉 X-Frame-Options）
    volumes:
      - ./docker/qdrant-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  # 后端服务 (Spring Boot)
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: interview-app-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

      # === Redis 连接 ===
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_API_KEY: ""
      APP_STORAGE_ENDPOINT: http://rustfs:9000
      APP_STORAGE_ACCESS_KEY: rustfsadmin
      APP_STORAGE_SECRET_KEY: rustfsadmin
      APP_STORAGE_BUCKET: interview-guide
      APP_STORAGE_REGION: us-east-1
      VOICE_SERVICE_URL: http://voice-service:8000
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost:3000"

      # === AI 模型配置 (必须配置) ===
      # 这里的变量值来自宿主机的环境变量或 .env 文件
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.5-flash}

  # 前端服务 (React + Nginx)
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: interview-frontend-dev
    depends_on:
      app:
        condition: service_started
    ports:
      - "5173:80"
    environment:
      # 如需构建时注入 Vite 环境变量，可在此添加 VITE_ 前缀变量
      # 当前前端通过 Nginx 反代 /api 到后端，无需额外配置
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx

  # 语音服务 (FastAPI + ASR/TTS)
  voice-service:
    build:
      context: voice-service
      dockerfile: Dockerfile
    container_name: interview-voice-dev
    ports:
      - "8000:8000"
    environment:
      SERVICE_PORT: 8000
      # 语音服务配置优先读取容器内 .env 文件（voice-service/.env）
      # 如需本地模型，将 voice-service/.env 中 VOICE_PROVIDER 改为 local
      VOICE_PROVIDER: siliconflow
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
